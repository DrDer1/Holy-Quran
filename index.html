<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>المصحف الكريم - النسخة الورقية</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="192.png">
    <link rel="apple-touch-icon" href="192.png">
    <meta name="theme-color" content="#f4e4c1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- المصحف الرئيسي -->
    <div id="mainContainer" class="main-container">
        <!-- زر القائمة الجانبية -->
        <button id="menuToggle" class="menu-toggle">☰</button>
        
        <!-- القائمة الجانبية المنسدلة -->
        <div id="sideMenu" class="side-menu">
            <div class="menu-header">
                <h3>المصحف الكريم</h3>
                <button id="closeMenu" class="close-menu">&times;</button>
            </div>
            
            <div class="menu-items">
                <button id="menuSurahs" class="menu-item">
                    <span class="menu-icon">📚</span>
                    فهرس السور
                </button>
                
                <button id="menuJuz" class="menu-item">
                    <span class="menu-icon">📖</span>
                    فهرس الأجزاء
                </button>
                
                <button id="menuSearch" class="menu-item">
                    <span class="menu-icon">🔍</span>
                    البحث
                </button>
                
                <button id="menuBookmark" class="menu-item">
                    <span class="menu-icon">📑</span>
                    العلامة المرجعية
                </button>
                
                <div class="menu-divider"></div>
                
                <div class="font-controls">
                    <span class="font-label">حجم الخط:</span>
                    <div class="font-buttons">
                        <button id="fontPlus" class="font-btn">أ+</button>
                        <button id="fontMinus" class="font-btn">أ-</button>
                    </div>
                </div>
                
                <div class="menu-divider"></div>
                
                <button id="menuAbout" class="menu-item">
                    <span class="menu-icon">ℹ️</span>
                    حول التطبيق
                </button>
            </div>
        </div>
        
        <!-- صفحة المصحف الواحدة -->
        <div id="quranPage" class="quran-page">
            <div class="page-frame">
                <div class="page-inner-frame">
                    <div class="page-content" id="pageContent">
                        <!-- محتوى الصفحة -->
                    </div>
                </div>
                
                <!-- رقم الصفحة في الأسفل -->
                <div class="page-number" id="pageNumber">١</div>
            </div>
        </div>
        
        <!-- نوافذ منبثقة -->
        <div id="surahModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>فهرس السور</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body" id="surahList"></div>
            </div>
        </div>
        
        <div id="juzModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>فهرس الأجزاء</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body" id="juzList"></div>
            </div>
        </div>
        
        <div id="searchModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>البحث في المصحف</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="search-box">
                        <select id="searchType">
                            <option value="text">بحث بالنص</option>
                            <option value="surah">رقم السورة</option>
                            <option value="ayah">رقم الآية</option>
                            <option value="juz">رقم الجزء</option>
                        </select>
                        <input type="text" id="searchInput" placeholder="اكتب للبحث...">
                        <button id="searchBtn">بحث</button>
                    </div>
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
        </div>
        
        <div id="aboutModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>حول التطبيق</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body about-content">
                    <h3>المصحف الكريم</h3>
                    <p>النسخة الورقية الرقمية</p>
                    <p>برواية حفص عن عاصم</p>
                    <p>الإصدار: 1.0</p>
                    <p>يعمل بدون إنترنت</p>
                </div>
            </div>
        </div>
    </div>

    <script src="quran.js"></script>
    <script src="app.js"></script>
</body>
</html>
