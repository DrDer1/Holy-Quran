<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الكريم - النسخة الورقية</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="192.png">
    <link rel="apple-touch-icon" href="192.png">
    <meta name="theme-color" content="#f4e4c1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الغلاف الأمامي للمصحف -->
    <div id="cover" class="quran-cover">
        <div class="cover-decoration">
            <div class="cover-pattern-top"></div>
            <div class="cover-content">
                <div class="cover-bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                <h1 class="cover-title">المصحف الكريم</h1>
                <div class="cover-subtitle">برواية حفص عن عاصم</div>
                <div class="cover-ornament">۞</div>
            </div>
            <div class="cover-pattern-bottom"></div>
        </div>
        <button id="openQuran" class="open-btn">افتح المصحف</button>
    </div>

    <!-- المصحف الرئيسي -->
    <div id="mainQuran" class="main-quran hidden">
        <!-- شريط علوي أنيق -->
        <div class="top-bar">
            <button id="backToCover" class="icon-btn" title="الغلاف">📕</button>
            <button id="showSurahs" class="icon-btn" title="فهرس السور">📚</button>
            <button id="showJuz" class="icon-btn" title="فهرس الأجزاء">📖</button>
            <button id="showSearch" class="icon-btn" title="البحث">🔍</button>
            <div class="font-adjust">
                <button id="fontPlus" class="font-btn">أ+</button>
                <button id="fontMinus" class="font-btn">أ-</button>
            </div>
        </div>

        <!-- صفحة المصحف -->
        <div class="quran-page-container">
            <div class="page-left">
                <div class="page-border">
                    <div class="page-inner-border">
                        <div class="page-content" id="pageLeftContent">
                            <!-- المحتوى الأيسر -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="page-right">
                <div class="page-border">
                    <div class="page-inner-border">
                        <div class="page-content" id="pageRightContent">
                            <!-- المحتوى الأيمن -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- شريط تنقل سفلي -->
        <div class="bottom-nav">
            <button id="prevPage" class="nav-btn">→ الصفحة السابقة</button>
            <div class="page-indicator">
                <span id="currentPageNum">1</span> / <span id="totalPages">604</span>
            </div>
            <button id="nextPage" class="nav-btn">الصفحة التالية ←</button>
        </div>

        <!-- نافذة فهرس السور -->
        <div id="surahIndex" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>فهرس السور</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="surah-index-list" id="surahIndexList"></div>
            </div>
        </div>

        <!-- نافذة فهرس الأجزاء -->
        <div id="juzIndex" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>فهرس الأجزاء</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="juz-index-list" id="juzIndexList"></div>
            </div>
        </div>

        <!-- نافذة البحث -->
        <div id="searchModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>البحث في المصحف</h2>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="search-options">
                    <select id="searchType">
                        <option value="text">بحث بالنص</option>
                        <option value="surah">رقم السورة</option>
                        <option value="ayah">رقم الآية</option>
                        <option value="juz">رقم الجزء</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="اكتب للبحث...">
                    <button id="searchBtn">بحث</button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
        </div>

        <!-- علامة حفظ المكان -->
        <div id="bookmark" class="bookmark hidden">📑</div>
    </div>

    <script src="quran.js"></script>
    <script src="app.js"></script>
</body>
</html>
